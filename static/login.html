<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в LabControl</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        .login-card { max-width: 400px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .login-card h2 { text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn-block { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Авторизация</h2>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="username" placeholder="Введите логин">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль">
        </div>
        <button class="btn btn-primary btn-block" id="login-btn">Войти</button>
    </div>

    <script src="api.js"></script>
    <script>
        document.getElementById('login-btn').addEventListener('click', async () => {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                await api.login(u, p);
                window.location.href = "index.html"; // Возвращаемся на главную
            } catch (e) {
                alert("Ошибка входа! Проверьте логин и пароль.");
            }
        });
    </script>
</body>
</html>
